<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal of the Day</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff7a45'/%3E%3Cpath d='M16 29h32c0 12-7 20-16 20s-16-8-16-20Z' fill='%23171a21'/%3E%3Cpath d='M13 27h38M22 17v10M32 13v14M42 17v10' stroke='%23171a21' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="./css/style.css" rel="stylesheet">
</head>

<body>

    <!-- Header -->
    <header
        class="app-header sticky-top d-flex align-items-center justify-content-between px-4 px-md-5 py-3 border-bottom border-app">
        <div class="fs-4 fw-bolder d-flex align-items-center gap-2">🍲 Meal of the <span class="text-accent">Day</span>
        </div>
        <nav class="d-flex gap-4 align-items-center small">
            <a href="#" class="nav-link-app active">Home</a>
            <a href="#view-saved" class="nav-link-app">Saved</a>
            <a href="#view-recent" class="nav-link-app">Recent</a>
            <a href="#settingsModal" class="text-muted-app">Settings</a>
        </nav>
        <a href="#settingsModal"
            class="avatar rounded-circle d-flex align-items-center justify-content-center fw-bold">A</a>
    </header>
<main>
    <div class="container py-5 pb-5" style="max-width: 768px;">

        <!-- HOME -->
        <div id="view-home">
            <div class="mb-4">
                <h1 class="fs-2 fw-bold">Not sure what to cook tonight?</h1>
                <p class="text-muted-app mt-1">We'll suggest a recipe — swap it if it's not your vibe.</p>
            </div>

            <div class="recipe-card bg-panel border border-app overflow-hidden">
              <div class="" id="left"></div>

                    <!-- Tabs (CSS only) -->
                    <div class="">
                        <input type="radio" name="tab" id="t1" class="tab-radio" checked>
                        <input type="radio" name="tab" id="t2" class="tab-radio">
                        <input type="radio" name="tab" id="t3" class="tab-radio">
                        <input type="radio" name="tab" id="t4" class="tab-radio">

                        <div class="tab-bar d-flex gap-1">
                            <label for="t1" class="tab-label">Ingredients</label>
                            <label for="t2" class="tab-label">Steps</label>
                            <label for="t3" class="tab-label">Nutrition</label>
                            <label for="t4" class="tab-label">Chef's Tips</label>
                        </div>

                        <div class="tab-panel pt-3" id="tabIngredients">
                            <ul class="ps-4 mb-0" id="listIngerde">
                            
                            </ul>
                        </div>

                        <div class="tab-panel pt-3" id="tabSteps">
                            <ul class="list-unstyled mb-0" id="listStep">
                                
                              
                            </ul>
                        </div>

                        <div class="tab-panel pt-3" id="tabNutrition">
                            <div class="row g-3" id="listNutrition">
                                
                            </div>
                        </div>

                        <div class="tab-panel pt-3" id="tabTips">
                            
                        </div>
                    </div>

                    <div class="d-flex gap-3 mt-4 flex-wrap" id="sendBtn">
                        <a href="#" class="btn btn-another flex-fill">🔀 Try Another Recipe</a>
                    </div>
                </div>
            </div>
    
  </div>

    </main>


    <script src="./js/main.js"></script>
</body>

</html>
